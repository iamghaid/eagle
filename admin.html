<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - Global Eagle</title>
    <style>
        :root {
            --main-gold: #b38f00; /* لون ذهبي متناسق مع الشعار */
            --dark-bg: #1e1e1e;
            --light-bg: #f4f6f9;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light-bg);
            margin: 0;
            padding: 20px;
            color: #333;
        }
        header {
            background-color: var(--dark-bg);
            color: #fff;
            padding: 15px 30px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 3px solid var(--main-gold);
        }
        header h1 { margin: 0; font-size: 24px; }
        
        /* شبكة الإحصائيات السريعة */
        .admin-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-box {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border-right: 5px solid var(--main-gold);
        }
        .stat-box h3 { margin: 0 0 10px 0; color: #666; font-size: 16px; }
        .stat-box p { margin: 0; font-size: 28px; font-weight: bold; color: var(--dark-bg); }

        /* قسّمي الشاشة إلى قطاعين (الفورم والجدول) */
        .admin-content {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
        }
        @media (max-width: 900px) {
            .admin-content { grid-template-columns: 1fr; }
        }

        /* تصميم النموذج (Form) */
        .form-section, .table-section {
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        h2 { margin-top: 0; color: var(--dark-bg); border-bottom: 2px solid #eee; padding-bottom: 10px; font-size: 18px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 14px; }
        .form-group input, .form-group select {
            width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;
        }
        .btn-submit {
            background-color: var(--main-gold); color: white; border: none; padding: 12px 20px;
            border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; font-size: 16px;
        }
        .btn-submit:hover { background-color: #947600; }

        /* تصميم الجدول (Table) */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; text-align: right; }
        th, td { padding: 12px; border-bottom: 1px solid #eee; }
        th { background-color: #f8f9fa; color: #555; }
        .status { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .status.confirmed { background-color: #d4edda; color: #155724; }
        .status.pending { background-color: #fff3cd; color: #856404; }
        .btn-action { padding: 4px 8px; background: #dc3545; color: white; border: none; border-radius: 3px; cursor: pointer; font-size: 12px; }
    </style>
</head>
<body>

    <header>
        <h1>لوحة تحكم المدير | Global Eagle</h1>
        <span>مرحباً، المسؤول الأدمن 👋</span>
    </header>

    <section class="admin-stats">
        <div class="stat-box">
            <h3>إجمالي الحجوزات</h3>
            <p>1,240</p>
        </div>
        <div class="stat-box">
            <h3>الرحلات النشطة</h3>
            <p>45</p>
        </div>
        <div class="stat-box">
            <h3>الطلبات المعلقة</h3>
            <p>12</p>
        </div>
    </section>

    <main class="admin-content">
       

        <section class="table-section">
            <h2>أحدث طلبات الحجز من العامة</h2>
            <table>
                <thead>
                    <tr>
                        <th>اسم العميل</th>
                        <th>الوجهة</th>
                        <th>التاريخ</th>
                        <th>الحالة</th>
                        <th>إجراء</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>أحمد محمد</td>
                        <td>دبي</td>
                        <td>2026-06-01</td>
                        <td><span class="status confirmed">مؤكد</span></td>
                        <td><button class="btn-action">إلغاء</button></td>
                    </tr>
                    <tr>
                        <td>سارة عبد الله</td>
                        <td>باريس</td>
                        <td>2026-06-15</td>
                        <td><span class="status pending">قيد الانتظار</span></td>
                        <td><button class="btn-action">إلغاء</button></td>
                    </tr>
                </tbody>
            </table>
        </section>

    </main>

</body>
</html>
<section class="form-section">
    <h2>إضافة بكج / رحلة جديدة</h2>
    <form onsubmit="event.preventDefault(); alert('تم نشر البكج بنجاح وجاري تجهيز العرض للعملاء!');">
        
        <div class="form-group">
            <label>عنوان الرحلة الرئيسى:</label>
            <input type="text" placeholder="مثال: سحر الطبيعة في ماليزيا" required>
        </div>

        <div class="form-group">
            <label>وصف وتفاصيل الرحلة (النص):</label>
            <textarea placeholder="اكتبي هنا تفاصيل البرنامج السياحي، الفنادق، والأنشطة..." rows="4" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: inherit;"></textarea>
        </div>

        <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div>
                <label>مدة الرحلة:</label>
                <input type="text" placeholder="مثال: 7 أيام / 6 ليالي" required>
            </div>
            <div>
                <label>السعر ($):</label>
                <input type="number" placeholder="السعر الإجمالي" required>
            </div>
        </div>

        <div class="form-group">
            <label>صورة البكج (Package Image):</label>
            <input type="file" accept="image/*" required>
        </div>

        <div class="form-group" style="background: #f8f9fa; padding: 10px; border-radius: 4px; border: 1px dashed var(--main-gold);">
            <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                <input type="checkbox" style="width: auto; cursor: pointer;">
                <span>تصنيف هذا البكج كـ <strong>"عرض خاص / لفترة محدودة" 🔥</strong></span>
            </label>
        </div>

        <button type="submit" class="btn-submit" style="margin-top: 15px;">نشر وتثبيت البكج في الموقع</button>
    </form>
</section>
