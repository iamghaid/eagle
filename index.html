<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>النسر العالمي للسفر والسياحة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            /* ألوان داكنة مريحة جداً للعين ومناسبة لشعارك الذهبي */
            --bg-dark-main: #12161f; 
            --bg-dark-cards: #1a202c;
            --gold-color: #D4AF37; 
            --text-light: #e2e8f0;
            --text-muted: #94a3b8;
        }

        body {
            background-color: var(--bg-dark-main);
            color: var(--text-light);
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 0;
        }

        /* الهيدر الأساسي للموقع */
        header {
            background-color: var(--bg-dark-cards);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* دمج صورة اللوقو الخاصة بك */
        .brand-logo {
            height: 55px;
            width: auto;
        }

        .brand-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--gold-color);
        }

        nav a {
            color: var(--text-light);
            text-decoration: none;
            margin-right: 20px;
            font-weight: 600;
            transition: color 0.2s;
        }

        nav a:hover {
            color: var(--gold-color);
        }

        /* قسم العرض الرئيسي */
        .hero-banner {
            text-align: center;
            padding: 80px 20px;
            background: linear-gradient(180deg, var(--bg-dark-cards) 0%, var(--bg-dark-main) 100%);
        }

        .hero-banner h1 {
            color: var(--gold-color);
            font-size: 2.5rem;
            margin-bottom: 15px;
        }

        /* شبكة عرض الباكجات */
        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .packages-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
        }

        .pkg-card {
            background-color: var(--bg-dark-cards);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #2d3748;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .pkg-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .pkg-details {
            padding: 20px;
        }

        .pkg-name {
            color: var(--gold-color);
            font-size: 1.3rem;
            margin: 0 0 10px 0;
        }

        .pkg-text {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .pkg-price {
            color: #4fd1c5;
            font-weight: bold;
            margin-top: 15px;
            font-size: 1.1rem;
        }

        .btn-action {
            background-color: var(--gold-color);
            color: #12161f;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 5px;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            cursor: pointer;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-container">
            <img src="logo.png" alt="شعار النسر العالمي" class="brand-logo">
            <div class="brand-title">النسر العالمي للسفر والسياحة</div>
        </div>
        <nav>
            <a href="#">الرئيسية</a>
            <a href="#packages-section">الباكجات الحالية</a>
        </nav>
    </header>

    <section class="hero-banner">
        <h1>مرحباً بكم في النسر العالمي</h1>
        <p style="color: var(--text-muted);">نصمم لكم أجمل الرحلات والباكجات السياحية المتميزة.</p>
    </section>

    <div class="main-container" id="packages-section">
        <div class="packages-grid" id="mainGrid">
            </div>
    </div>

    <script>
        function displayPackages() {
            const stored = JSON.parse(localStorage.getItem('company_packages')) || [];
            const grid = document.getElementById('mainGrid');
            grid.innerHTML = '';

            if(stored.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted);">لا توجد باكجات معروضة حالياً.</p>`;
                return;
            }

            stored.forEach(item => {
                grid.innerHTML += `
                    <div class="pkg-card">
                        <img src="${item.img || 'https://via.placeholder.com/400x200'}" class="pkg-image" alt="${item.name}">
                        <div class="pkg-details">
                            <h3 class="pkg-name">${item.name}</h3>
                            <p class="pkg-text">${item.description}</p>
                            <div class="pkg-price">السعر: ${item.price}</div>
                            <button class="btn-action">حجز الآن</button>
                        </div>
                    </div>
                `;
            });
        }
        window.onload = displayPackages;
    </script>
</body>
</html>
