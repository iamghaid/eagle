<!-- ✅ الخطوة 1: CSS — قبل </head> -->
<style>
#gel-loader {
  position: fixed;
  inset: 0;
  z-index: 99999;
  background: radial-gradient(ellipse at 50% 60%, #001d5c 0%, #00113a 55%, #000a22 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: opacity 1.2s ease;
}
#gel-loader.gel-out {
  opacity: 0;
  pointer-events: none;
}
.gel-star {
  position: absolute;
  background: #fff;
  border-radius: 50%;
  animation: gel-twk 3s ease-in-out infinite;
}
@keyframes gel-twk {
  0%,100% { opacity: .15; }
  50%      { opacity: 1;   }
}
.gel-float {
  animation: gel-soar 5s cubic-bezier(.23,1,.32,1) both;
}
@keyframes gel-soar {
  0%   { transform: translateY(110px) scale(.25) rotate(-6deg); opacity: 0; }
  40%  { transform: translateY(-18px) scale(1.07) rotate(2deg); opacity: 1; }
  65%  { transform: translateY(8px)  scale(.97)  rotate(-1deg); }
  85%  { transform: translateY(-4px) scale(1.02); }
  100% { transform: translateY(0)   scale(1)    rotate(0);    opacity: 1; }
}
.gel-bob {
  animation: gel-bob 3.5s ease-in-out infinite;
  animation-delay: 5.2s;
}
@keyframes gel-bob {
  0%,100% { transform: translateY(0)   rotate(0);    }
  30%     { transform: translateY(-7px) rotate(1deg); }
  70%     { transform: translateY(4px)  rotate(-.5deg); }
}
.gel-glow {
  animation: gel-glow 2.8s ease-in-out infinite;
  animation-delay: 5s;
}
@keyframes gel-glow {
  0%,100% { filter: drop-shadow(0 0 18px rgba(212,175,55,.45)); }
  50%     { filter: drop-shadow(0 0 40px rgba(212,175,55,.8))
                    drop-shadow(0 0 70px rgba(212,175,55,.3)); }
}
.gel-ring {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  width: 300px; height: 300px;
  border-radius: 50%;
  border: 1px solid rgba(212,175,55,.15);
  opacity: 0;
  animation: gel-ring 2s ease-in-out infinite;
  animation-delay: 5.5s;
}
@keyframes gel-ring {
  0%   { transform: translate(-50%,-50%) scale(.85); opacity: 0; }
  50%  { opacity: 1; }
  100% { transform: translate(-50%,-50%) scale(1.25); opacity: 0; }
}
.gel-name {
  color: #D4AF37;
  font-size: 34px;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
  margin-top: 22px;
  opacity: 0;
  font-family: 'Playfair Display', Georgia, serif;
  text-shadow: 0 0 30px rgba(212,175,55,.4);
  animation: gel-up .9s cubic-bezier(.16,1,.3,1) forwards;
  animation-delay: 2.6s;
}
.gel-sub {
  color: rgba(255,255,255,.55);
  font-size: 12px;
  letter-spacing: .28em;
  text-transform: uppercase;
  margin-top: 7px;
  opacity: 0;
  font-family: 'Manrope', Arial, sans-serif;
  font-weight: 300;
  animation: gel-up .9s cubic-bezier(.16,1,.3,1) forwards;
  animation-delay: 3.1s;
}
@keyframes gel-up {
  0%   { opacity: 0; transform: translateY(18px); }
  100% { opacity: 1; transform: translateY(0);    }
}
.gel-line {
  height: 1px;
  background: linear-gradient(90deg, transparent, #D4AF37, transparent);
  width: 0;
  margin: 14px auto;
  animation: gel-line 1s ease forwards;
  animation-delay: 3.3s;
}
@keyframes gel-line { to { width: 190px; } }
.gel-bar-wrap {
  width: 220px; height: 2px;
  background: rgba(255,255,255,.1);
  border-radius: 1px;
  margin-top: 38px;
  overflow: hidden;
  opacity: 0;
  animation: gel-fi .5s forwards;
  animation-delay: 3.6s;
}
@keyframes gel-fi { to { opacity: 1; } }
.gel-bar {
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, #D4AF37, #f5dc70, #D4AF37);
  background-size: 200%;
  border-radius: 1px;
  animation: gel-prog 3.8s cubic-bezier(.4,0,.2,1) forwards,
             gel-shim 1.2s linear infinite;
  animation-delay: 3.6s, 3.6s;
}
@keyframes gel-prog {
  0%  { width: 0;   }
  35% { width: 45%; }
  75% { width: 78%; }
  95% { width: 93%; }
  100%{ width: 100%;}
}
@keyframes gel-shim {
  0%   { background-position: 200% center; }
  100% { background-position: -200% center; }
}
.gel-hint {
  color: rgba(255,255,255,.35);
  font-size: 11px;
  letter-spacing: .18em;
  text-transform: uppercase;
  margin-top: 11px;
  font-family: Arial, sans-serif;
  opacity: 0;
  animation: gel-fi .5s forwards;
  animation-delay: 4.2s;
}
</style>

<!-- ✅ الخطوة 3: JavaScript — قبل </body> -->
<script>
(function () {
  // ---- نجوم الخلفية ----
  var wrap = document.getElementById('gel-stars-wrap');
  for (var i = 0; i < 75; i++) {
    var s = document.createElement('div');
    s.className = 'gel-star';
    var sz = Math.random() * 2.2 + 0.4;
    s.style.cssText =
      'width:' + sz + 'px;' +
      'height:' + sz + 'px;' +
      'top:' + (Math.random() * 100) + '%;' +
      'left:' + (Math.random() * 100) + '%;' +
      'animation-delay:' + (Math.random() * 4) + 's;' +
      'animation-duration:' + (2 + Math.random() * 2.5) + 's';
    wrap.appendChild(s);
  }

  // ---- إخفاء الـ loader بعد الانتهاء ----
  // غيّر 8200 (ملي ثانية = 8.2 ثواني) حسب ما تبغى
  setTimeout(function () {
    var loader = document.getElementById('gel-loader');
    loader.classList.add('gel-out');
    // إزالة كاملة من الـ DOM بعد انتهاء الـ transition
    setTimeout(function () {
      loader.remove();
    }, 1300);
  }, 8200);
})();
</script>
